services:
  opencode:
    build: .
    container_name: opencode

    ports:
      - "4096:4096"

    volumes:
      - /service-data/opencode/workspace:/workspace
      - /service-data/opencode/share:/home/dev/.local/share/opencode
      - /service-data/opencode/state:/home/dev/.local/state/opencode
      - /service-data/opencode/config:/home/dev/.config/opencode
      - /service-data/opencode/cache:/home/dev/.cache/opencode

      # The container can control the host Docker daemon. This is effectively
      # host-root-equivalent access and is appropriate only for this trusted
      # development environment.
      - /var/run/docker.sock:/var/run/docker.sock

    # Set DOCKER_GID to the numeric group owning /var/run/docker.sock on the
    # Docker host (for example: stat -c '%g' /var/run/docker.sock).
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID to the host Docker socket group ID}"

    environment:
      TZ: ${TZ:-Europe/London}

      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:?}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?}

      FORGEJO_AGENT_TOKEN: ${FORGEJO_AGENT_TOKEN:?}
      FORGEJO_SERVER: ${FORGEJO_SERVER:?}

      COOLIFY_API_URL: ${COOLIFY_API_URL:?}
      COOLIFY_CONTEXT: ${COOLIFY_CONTEXT:?}
      COOLIFY_API_KEY: ${COOLIFY_API_KEY:?}

    restart: unless-stopped
