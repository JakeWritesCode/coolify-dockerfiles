services:
  hermes-agent:
    image: hermes-agent-local:latest
    build:
      context: .
      dockerfile: hermes/Dockerfile.agent
    command: 'gateway run'
    environment:
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_UID=1000
      - HERMES_GID=1000
      - HERMES_DOCKER_BINARY=/usr/bin/docker

      # Safe bootstrap/fallback values. After deployment, persist the matching
      # terminal.* settings via `hermes config set`, not config.yaml edits.
      - TERMINAL_ENV=docker
      - TERMINAL_CWD=/workspace
      - TERMINAL_DOCKER_IMAGE=hermes-dev:local
      - 'TERMINAL_DOCKER_VOLUMES=["/media/hermes-workspace:/workspace:rw","/var/run/docker.sock:/var/run/docker.sock"]'
      - 'TERMINAL_DOCKER_EXTRA_ARGS=["--group-add","${DOCKER_GID:?Set DOCKER_GID to the host Docker socket numeric group ID}"]'
      - TERMINAL_DOCKER_RUN_AS_HOST_USER=true
      - TERMINAL_DOCKER_PERSIST_ACROSS_PROCESSES=true

      - 'OPENROUTER_API_KEY=${OPENROUTER_API_KEY}'
      - 'ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}'
      - 'OPENAI_API_KEY=${OPENAI_API_KEY}'
      - 'GOOGLE_API_KEY=${GOOGLE_API_KEY}'
      - 'FIRECRAWL_API_URL=${FIRECRAWL_API_URL}'
      - 'FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}'
      - 'FORGEJO_AGENT_TOKEN=${FORGEJO_AGENT_TOKEN}'
      - 'FORGEJO_SERVER=${FORGEJO_SERVER}'
      - 'COOLIFY_API_TOKEN=${COOLIFY_API_TOKEN}'
      - 'COOLIFY_API_URL=${COOLIFY_API_URL}'
      - 'COOLIFY_CONTEXT=${COOLIFY_CONTEXT}'
    group_add:
      - '${DOCKER_GID:?Set DOCKER_GID to the host Docker socket numeric group ID}'
    volumes:
      - '/service-data/hermes/hermes-home:/home/hermes/.hermes'
      - '/service-data/hermes/hermes-agent-src:/opt/hermes'
      - '/media/hermes-workspace:/workspace'
      - '/var/run/docker.sock:/var/run/docker.sock'
    healthcheck:
      test:
        - CMD-SHELL
        - 'test -d /home/hermes/.hermes && docker version --format "{{.Server.Version}}" >/dev/null'
      interval: 10s
      timeout: 5s
      retries: 5

  # Ensures the exact terminal image is built and independently inspectable.
  # Hermes creates its own labelled persistent terminal container from this
  # same image for an active profile/session.
  hermes-dev:
    image: hermes-dev:local
    build:
      context: .
      dockerfile: hermes/Dockerfile.dev
    user: '1000:1000'
    working_dir: /workspace
    group_add:
      - '${DOCKER_GID:?Set DOCKER_GID to the host Docker socket numeric group ID}'
    environment:
      - HOME=/home/dev
      - COOLIFY_API_KEY=${COOLIFY_API_KEY}
    volumes:
      - '/media/hermes-workspace:/workspace'
      - '/var/run/docker.sock:/var/run/docker.sock'
    healthcheck:
      test:
        - CMD-SHELL
        - 'go version && node --version && npm --version && docker version --format "{{.Server.Version}}" >/dev/null'
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  hermes-webui:
    image: hermes-webui-docker:local
    build:
      context: .
      dockerfile: hermes/Dockerfile.webui
    depends_on:
      - hermes-agent
    environment:
      - SERVICE_URL_HERMESWEBUI_8787
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - WANTED_UID=1000
      - WANTED_GID=1000
      - 'HERMES_WEBUI_PASSWORD=${SERVICE_PASSWORD_HERMESWEBUI}'
      - PYTHONPATH=/home/hermeswebui/.hermes/hermes-agent
      - HERMES_DOCKER_BINARY=/usr/local/bin/docker
    group_add:
      - '${DOCKER_GID:?Set DOCKER_GID to the host Docker socket numeric group ID}'
    volumes:
      - '/service-data/hermes/hermes-home:/home/hermeswebui/.hermes'
      - '/service-data/hermes/hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent:ro'
      - '/media/hermes-workspace:/workspace'
      - '/var/run/docker.sock:/var/run/docker.sock'
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://127.0.0.1:8787/health'
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - '8787:8787'