services:
  hermes-agent:
    image: nousresearch/hermes-agent
    command: 'gateway run'
    environment:
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_UID=1000
      - HERMES_GID=1000
      - 'OPENROUTER_API_KEY=${OPENROUTER_API_KEY}'
      - 'ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}'
      - 'OPENAI_API_KEY=${OPENAI_API_KEY}'
      - 'GOOGLE_API_KEY=${GOOGLE_API_KEY}'
    volumes:
      - '/service-data/hermes/hermes-home:/home/hermes/.hermes'
      - '/service-data/hermes/hermes-agent-src:/opt/hermes'
      - '/media/hermes-workspace:/workspace'
    healthcheck:
      test:
        - CMD-SHELL
        - 'test -d /home/hermes/.hermes || exit 1'
      interval: 10s
      timeout: 5s
      retries: 5

  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui
    depends_on:
      - hermes-agent
    environment:
      - SERVICE_URL_HERMESWEBUI_8787
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - WANTED_UID=1000
      - WANTED_GID=1000
      - 'HERMES_WEBUI_PASSWORD=${SERVICE_PASSWORD_HERMESWEBUI}'
      - PYTHONPATH=/home/hermeswebui/.hermes/hermes-agent
    volumes:
      - '/service-data/hermes/hermes-home:/home/hermeswebui/.hermes'
      - '/service-data/hermes/hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent:ro'
      - '/media/hermes-workspace:/workspace'
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://127.0.0.1:8787/health'
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - '8787:8787'